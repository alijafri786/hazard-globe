# Optional local Postgres for the server: `docker compose up -d`, then in server/.env set
# DATABASE_URL=postgres://hazard:hazard@localhost:5432/hazard_globe
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: hazard # local development only
      POSTGRES_DB: hazard_globe
    ports:
      - '127.0.0.1:5432:5432' # not reachable from other machines
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
